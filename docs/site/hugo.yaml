title: go-libfossil
baseURL: "https://libfossil-docs.daniel-mestas.workers.dev/"

module:
  imports:
    - path: github.com/imfing/hextra

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

menu:
  main:
    - name: Get started
      pageRef: /docs/get-started
      weight: 1
    - name: Concepts
      pageRef: /docs/concepts
      weight: 2
    - name: Guides
      pageRef: /docs/guides
      weight: 3
    - name: Reference
      pageRef: /docs/reference
      weight: 4
    - name: GitHub
      weight: 5
      url: "https://github.com/danmestas/go-libfossil"
      params:
        icon: github
    - name: Search
      weight: 6
      params:
        type: search

params:
  # version and goVersion are written by scripts/sync-version.sh from the
  # latest release tag and go.mod; do not edit them by hand.
  version: "0.15.0"
  goVersion: "1.26.0"

  navbar:
    displayTitle: true
    displayLogo: false

  theme:
    default: system
    displayToggle: true

  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
      tokenize: forward

  footer:
    displayCopyright: true
    displayPoweredBy: false

  editURL:
    enable: true
    base: "https://github.com/danmestas/go-libfossil/edit/main/docs/site/content"

  page:
    width: wide
